<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер счетчика</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
        }
        .camera-container {
            position: relative;
            width: 100%;
            height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-frame {
            position: absolute;
            width: 80%;
            height: 120px;
            border: 3px dashed #34c759;
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        .controls {
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background-color: #121212;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .instructions { font-size: 14px; color: #aaa; text-align: center; }
        .btn-capture {
            width: 100%;
            padding: 16px;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        canvas { display: none; }
    </style>
</head>
<body>

    <div class="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <div class="scan-frame"></div>
    </div>

    <div class="controls">
        <h2>📸 Наведите на счетчик</h2>
        <p class="instructions">Поместите циферблат в зелёную рамочку</p>
        <button class="btn-capture" id="captureBtn">📸 Сделать снимок</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');

        navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } },
            audio: false
        }).catch(() => {
            return navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });
        }).then((stream) => {
            video.srcObject = stream;
        }).catch((err) => {
            alert("Ошибка камере: " + err.message);
        });

        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = canvas.toDataURL('image/jpeg', 0.8);

            tg.sendData(JSON.stringify({
                action: "photo_captured",
                image: imageData
            }));

            tg.close();
        });
    </script>
</body>
</html>
