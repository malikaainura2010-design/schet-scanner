<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер счетчика</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
        }
        .camera-container {
            position: relative;
            width: 100%;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-frame {
            position: absolute;
            width: 85%;
            height: 100px;
            border: 3px dashed #34c759;
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }
        .info-panel {
            width: 100%;
            padding: 15px;
            text-align: center;
            background-color: #121212;
        }
        .status-text {
            font-size: 16px;
            font-weight: 600;
            color: #34c759;
        }
        .instructions { font-size: 13px; color: #aaa; margin-top: 4px; }
        canvas { display: none; }
    </style>
</head>
<body>

    <div class="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <div class="scan-frame"></div>
    </div>

    <div class="info-panel">
        <div class="status-text" id="statusText">Наведите рамочку четко на цифры</div>
        <p class="instructions">Держите телефон ровно, без сильных бликов</p>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        tg.MainButton.setText("🔍 Сканировать");
        tg.MainButton.show();

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('statusText');

        navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } },
            audio: false
        }).catch(() => {
            return navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });
        }).then((stream) => {
            video.srcObject = stream;
        });

        // Функция предобработки картинки (увеличение контраста и переведение в Ч/Б)
        function preprocessImage(ctx, width, height) {
            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                // Перевод в оттенки серого
                const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                // Повышение контрастности (порог)
                const threshold = avg > 110 ? 255 : 0;
                data[i] = threshold;     // Red
                data[i + 1] = threshold; // Green
                data[i + 2] = threshold; // Blue
            }
            ctx.putImageData(imgData, 0, 0);
        }

        async function scanNumbers() {
            tg.MainButton.showProgress();
            statusText.innerText = "⏳ Идёт обработка и сканирование...";

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Кроп строго по рамке
            const frameWidth = canvas.width * 0.85;
            const frameHeight = 100 * (canvas.height / window.innerHeight);
            const startX = (canvas.width - frameWidth) / 2;
            const startY = (canvas.height - frameHeight) / 2;

            const croppedCanvas = document.createElement('canvas');
            croppedCanvas.width = frameWidth;
            croppedCanvas.height = frameHeight;
            const croppedCtx = croppedCanvas.getContext('2d');

            croppedCtx.drawImage(
                canvas, 
                startX, startY, frameWidth, frameHeight, 
                0, 0, frameWidth, frameHeight
            );

            // Применяем фильтр контрастности
            preprocessImage(croppedCtx, frameWidth, frameHeight);

            try {
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789',
                    tessedit_pageseg_mode: '7' // Режим: одна строка текста
                });

                const ret = await worker.recognize(croppedCanvas.toDataURL('image/png'));
                await worker.terminate();

                const digitsOnly = ret.data.text.replace(/[^0-9]/g, '').trim();

                if (digitsOnly.length > 0) {
                    statusText.innerText = "✅ Распознано: " + digitsOnly;
                    
                    tg.sendData(JSON.stringify({
                        action: "scan_complete",
                        readings: digitsOnly
                    }));
                } else {
                    tg.MainButton.hideProgress();
                    statusText.innerText = "⚠️ Не удалось распознать. Поднесите ближе!";
                }

            } catch (e) {
                tg.MainButton.hideProgress();
                statusText.innerText = "Ошибка: " + e.message;
            }
        }

        tg.MainButton.onClick(() => {
            scanNumbers();
        });
    </script>
</body>
</html>
