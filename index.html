<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер счетчика</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
        }
        .camera-container {
            position: relative;
            width: 100%;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-frame {
            position: absolute;
            width: 80%;
            height: 120px;
            border: 3px dashed #34c759;
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        .info-panel {
            width: 100%;
            padding: 15px;
            text-align: center;
            background-color: #121212;
        }
        .instructions { font-size: 14px; color: #aaa; margin-top: 4px; }
        canvas { display: none; }
    </style>
</head>
<body>

    <div class="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <div class="scan-frame"></div>
    </div>

    <div class="info-panel">
        <h2>📸 Наведите на счетчик</h2>
        <p class="instructions">Поместите циферблат в зелёную рамочку</p>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Показываем главную синюю кнопку Telegram внизу
        tg.MainButton.setText("📸 Сделать снимок");
        tg.MainButton.show();

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');

        // Включаем заднюю камеру
        navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } },
            audio: false
        }).catch(() => {
            return navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });
        }).then((stream) => {
            video.srcObject = stream;
        }).catch((err) => {
            alert("Ошибка доступа к камере: " + err.message);
        });

        // Клик по главной кнопке Telegram
        tg.MainButton.onClick(() => {
            tg.MainButton.showProgress(); // Показываем анимацию загрузки

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = canvas.toDataURL('image/jpeg', 0.6);

            try {
                tg.sendData(JSON.stringify({
                    action: "photo_captured",
                    image: imageData
                }));
            } catch (e) {
                alert("Ошибка отправки: " + e.message);
            }
        });
    </script>
</body>
</html>
