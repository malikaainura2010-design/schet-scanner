<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер счетчика</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
        }
        .camera-container {
            position: relative;
            width: 100%;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .scan-frame {
            position: absolute;
            width: 80%;
            height: 120px;
            border: 3px dashed #34c759;
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
            pointer-events: none;
            overflow: hidden;
        }
        .laser-line {
            display: none;
            position: absolute;
            width: 100%;
            height: 3px;
            background: #34c759;
            box-shadow: 0 0 12px 3px #34c759;
            animation: scanAnimation 1s infinite ease-in-out alternate;
        }
        @keyframes scanAnimation {
            0% { top: 0%; }
            100% { top: 95%; }
        }
        .info-panel {
            width: 100%;
            padding: 15px;
            text-align: center;
            background-color: #121212;
        }
        .status-text {
            font-size: 16px;
            font-weight: 600;
            color: #34c759;
        }
        canvas { display: none; }
    </style>
</head>
<body>

    <div class="camera-container">
        <video id="webcam" autoplay playsinline muted webkit-playsinline></video>
        <div class="scan-frame">
            <div class="laser-line" id="laser"></div>
        </div>
    </div>

    <div class="info-panel">
        <div class="status-text" id="statusText">Поместите цифры в рамку</div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // ⚠️ СУДА ВСТАВЬ СВОЮ ССЫЛКУ ИЗ LOCALTUNNEL (не забудь /upload на конце!)
        const SERVER_URL = "https://wide-bikes-study.loca.lt/upload"; 

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id || "";

        tg.MainButton.setText("🔍 Сканировать");
        tg.MainButton.show();

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('statusText');
        const laser = document.getElementById('laser');

        navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } },
            audio: false
        }).catch(() => {
            return navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });
        }).then((stream) => {
            video.srcObject = stream;
        });

        tg.MainButton.onClick(async () => {
            laser.style.display = "block";
            statusText.innerText = "⚡ Отправка кадра на сервер...";
            tg.MainButton.showProgress();

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = canvas.toDataURL('image/jpeg', 0.7);

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        image: imageData
                    })
                });

                if (response.ok) {
                    tg.close();
                } else {
                    alert("Ошибка сервера при отправке");
                    tg.MainButton.hideProgress();
                }
            } catch (e) {
                alert("Ошибка сети: " + e.message);
                tg.MainButton.hideProgress();
            }
        });
    </script>
</body>
</html>
